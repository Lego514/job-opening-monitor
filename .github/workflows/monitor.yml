name: Job monitor

on:
  schedule:
    - cron: "*/15 * * * *" # every ~15 min (GitHub cron is best-effort)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The University of Delaware source needs a real browser: UD fronts its
      # PageUp board with an AWS WAF challenge that a plain fetch can't answer.
      - run: npx playwright install --with-deps chromium

      # The long tail (Indeed / ZipRecruiter) via python-jobspy — the one source
      # that reaches employers with no ATS board of their own. Deliberately fenced
      # off from the Node run: it is ToS-gray and blockable (a GitHub runner IP
      # gets blocked more readily than a home one), so every step here is
      # `continue-on-error` with its own timeout, and the adapter treats a missing
      # file as "no rows this run". Nothing it writes is committed — the JSON
      # lives in the runner's temp dir and dies with the runner.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/jobspy-requirements.txt
      - name: Install python-jobspy
        continue-on-error: true
        run: pip install -r scripts/jobspy-requirements.txt
      - name: Scrape the long tail (JobSpy)
        continue-on-error: true
        timeout-minutes: 5
        env:
          JOBSPY_OUT: ${{ runner.temp }}/jobspy-jobs.json
          # Optional tuning as repo Variables — e.g. JOBSPY_SITES to try linkedin,
          # which is off by default (it rate-limits hard without proxies).
          JOBSPY_SITES: ${{ vars.JOBSPY_SITES }}
          JOBSPY_HOURS_OLD: ${{ vars.JOBSPY_HOURS_OLD }}
          JOBSPY_RESULTS: ${{ vars.JOBSPY_RESULTS }}
          JOBSPY_BUDGET_SEC: ${{ vars.JOBSPY_BUDGET_SEC }}
        run: python scripts/jobspy_scrape.py

      - run: npm start
        env:
          # Written by the step above. If that step failed, was blocked or timed
          # out there is simply no file, and the adapter logs
          # "[fetch] JobSpy: skipped (no file)".
          JOBSPY_FILE: ${{ runner.temp }}/jobspy-jobs.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRACKER_USER_ID: ${{ secrets.TRACKER_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          # LLM classification (src/llm.ts). Unset = the run still works on the
          # regex path and says so via the checkEnv degraded notice.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional behavior (set as repo Variables, not Secrets):
          SKIP_NO_SPONSORSHIP: ${{ vars.SKIP_NO_SPONSORSHIP }}
          MAX_AGE_DAYS: ${{ vars.MAX_AGE_DAYS }}
          MAX_ALERTS_PER_RUN: ${{ vars.MAX_ALERTS_PER_RUN }}
          WORKDAY_MAX_RESULTS: ${{ vars.WORKDAY_MAX_RESULTS }}
          LLM_MAX_PER_RUN: ${{ vars.LLM_MAX_PER_RUN }}

      # The monitor needs monitoring: a crashing cron is otherwise invisible
      # until you notice the alerts stopped. (This is exactly what happened
      # 2026-07-01..14 — every run failed on unset secrets, unnoticed.)
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram not configured — skipping failure alert."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 Job monitor run FAILED — no alerts this run. ${RUN_URL}" \
            -o /dev/null
