name: Daily apply queue

# The 15-minute monitor answers "what's new?". This answers "what do I apply to
# today?" — once a morning, as a five-item checklist. GitHub cron is UTC-only
# and has no DST, so two schedules are declared; `npm run digest` sends at most
# one queue per America/New_York day, so whichever run lands first wins.
on:
  schedule:
    - cron: "0 12 * * *" # 08:00 EDT (Mar–Nov)
    - cron: "0 13 * * *" # 08:00 EST (Nov–Mar)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the queue without sending or recording it"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # No clock gate here. An earlier version skipped unless the New York hour
      # was exactly "08", which never once matched: GitHub's scheduled runs fire
      # 4-5 hours late, so every run from 2026-09-12 to 09-16 "succeeded" without
      # sending anything. The de-duplication is now inside the job, keyed on the
      # New York date, so a late runner still delivers the day's queue.
      - name: New York time at start
        run: 'echo "New York: $(TZ=America/New_York date "+%F %H:%M")"'

      # No Playwright, no ATS fetching, no LLM calls: this job is three Supabase
      # reads and one Telegram message, so it finishes in seconds.
      - name: Send the daily apply queue
        run: npm run digest ${{ inputs.dry_run && '-- --dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRACKER_USER_ID: ${{ secrets.TRACKER_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional tuning (repo Variables, not Secrets):
          DIGEST_SIZE: ${{ vars.DIGEST_SIZE }}
          DIGEST_MAX_AGE_DAYS: ${{ vars.DIGEST_MAX_AGE_DAYS }}
          DIGEST_POOL_DAYS: ${{ vars.DIGEST_POOL_DAYS }}

      # A silently broken queue is worse than a noisy one: the whole point is the
      # message arriving every morning, so its absence has to be announced.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram not configured — skipping failure alert."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 Daily apply queue FAILED — no queue today. ${RUN_URL}" \
            -o /dev/null
